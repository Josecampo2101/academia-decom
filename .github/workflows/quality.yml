name: Verificación de calidad

on:
  push:
    branches:
      - "main"
      - "fix/**"
      - "feature/**"
      - "security/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pruebas, auditoría, lint, tipos y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Revisar estilo y errores estáticos
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Compilar aplicación
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
